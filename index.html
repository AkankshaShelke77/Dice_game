<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dice Game</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Animated Background -->

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <main class="game-container">

        <div class="game-card">


            <!-- HEADER -->

            <div class="game-header">

                <h1>
                    <span class="title-dice">🎲</span>
                    Dice Game
                </h1>

                <p>
                    Roll the dice and test your luck!
                </p>

            </div>



            <!-- PLAYERS -->

            <div class="row players-row">


                <!-- PLAYER -->

                <div class="col-md-6">

                    <div class="player-card">

                        <h2>Player</h2>


                        <!-- CSS Dice -->

                        <div id="playerDice"
                             class="dice">

                            <span class="dot dot1"></span>
                            <span class="dot dot2"></span>
                            <span class="dot dot3"></span>
                            <span class="dot dot4"></span>
                            <span class="dot dot5"></span>
                            <span class="dot dot6"></span>

                        </div>


                        <div class="score"
                             id="playerScore">

                            Score: 0

                        </div>

                    </div>

                </div>



                <!-- COMPUTER -->

                <div class="col-md-6">

                    <div class="player-card">

                        <h2>Computer</h2>


                        <!-- CSS Dice -->

                        <div id="computerDice"
                             class="dice">

                            <span class="dot dot1"></span>
                            <span class="dot dot2"></span>
                            <span class="dot dot3"></span>
                            <span class="dot dot4"></span>
                            <span class="dot dot5"></span>
                            <span class="dot dot6"></span>

                        </div>


                        <div class="score"
                             id="computerScore">

                            Score: 0

                        </div>

                    </div>

                </div>

            </div>



            <!-- RESULT -->

            <div class="result-section">

                <h3 id="result">

                    Click Roll Dice to Start!

                </h3>

            </div>



            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    id="rollBtn"
                    class="btn btn-primary roll-button">

                    🎲 Roll Dice

                </button>


                <button
                    id="resetBtn"
                    class="btn reset-button">

                    🔄 Reset

                </button>

            </div>



            <!-- GAME INFO -->

            <div class="game-info">

                First player to reach
                <strong>10 points</strong>
                wins!

            </div>


        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
