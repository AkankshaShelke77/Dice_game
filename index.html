<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dice game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="status">Player 1's Turn</h1>
    
    <div class="container">
        <div class="player-box active" id="p0">
            <p>P1</p>
            <div class="scene">
                <div class="cube" id="cube0">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>

        <div class="player-box" id="p1">
            <p>P2</p>
            <div class="scene">
                <div class="cube" id="cube1">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>

        <div class="player-box" id="p2">
            <p>P3</p>
            <div class="scene">
                <div class="cube" id="cube2">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>

        <div class="player-box" id="p3">
            <p>P4</p>
            <div class="scene">
                <div class="cube" id="cube3">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="rollBtn">Roll Dice</button>
    <button id="resetBtn" style="display:none" onclick="location.reload()">Restart</button>

    <script src="script.js"></script>
</body>
</html>
